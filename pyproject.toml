
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image_dataset_auditor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
image-auditor = "image_auditor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
